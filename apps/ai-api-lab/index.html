<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>AI API Lab</title><link rel="stylesheet" href="styles.css"></head><body><main><a class="back" href="../../">← Hub</a><header><span>Gateway tester</span><h1>AI API Lab</h1><p>Valide o Worker, modelos, diagnóstico e respostas sem expor a chave da OpenAI.</p></header><section class="panel"><label>URL do Worker<input id="url" placeholder="https://vibecode-ai-api.seu-subdominio.workers.dev"></label><label>Bearer Token<input id="token" type="password" autocomplete="off" placeholder="AI_API_BEARER_TOKEN"></label><div class="actions"><button data-action="health">Health</button><button data-action="models">Models</button><button data-action="debug">Diagnóstico</button></div></section><section class="panel"><label>Modelo<input id="model" value="gpt-5"></label><label>Mensagem<textarea id="prompt" rows="5">Responda apenas: gateway funcionando.</textarea></label><button id="send" class="primary">Enviar chat</button></section><section class="panel output"><div class="output-head"><strong>Resultado</strong><span id="status">Pronto</span></div><pre id="result">Configure o endpoint e o token.</pre></section><p class="note">A URL e o token são salvos apenas neste navegador usando localStorage.</p></main><script src="app.js"></script></body></html>
