name: PR Preview · Cloudflare Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # No Cloudflare secrets are available to pull requests originating from forks.
    if: github.event.action != 'closed' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test app
        run: npm test
      - name: Check required configuration
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROJECT: vibecoding-card-translator-preview
        run: |
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }

      - name: Prepare static site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar --exclude=.git --exclude=.github --exclude=node_modules --exclude='*.test.js' -cf - . | tar -xf - -C "$RUNNER_TEMP/site"
      - name: Publish preview to Cloudflare Pages
        id: publish
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROJECT: vibecoding-card-translator-preview
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            DEPLOY_BRANCH="pr-$PR_NUMBER"
          else
            DEPLOY_BRANCH="manual-$RUN_ID"
          fi
          set -o pipefail
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/site" --project-name "$CF_PROJECT" --branch "$DEPLOY_BRANCH" 2>&1 | tee "$RUNNER_TEMP/pages-deploy.log"
          echo "deploy_branch=$DEPLOY_BRANCH" >> "$GITHUB_OUTPUT"
      - name: Preview information
        env:
          PROJECT: vibecoding-card-translator-preview
          DEPLOY_BRANCH: ${{ steps.publish.outputs.deploy_branch }}
        run: |
          {
            echo "### Cloudflare Pages preview"
            echo ""
            echo "Branch alias (confirm from Cloudflare deployment output):"
            echo "https://$DEPLOY_BRANCH.$PROJECT.pages.dev/"
            echo ""
            echo "Minecraft Companion: https://$DEPLOY_BRANCH.$PROJECT.pages.dev/apps/minecraft-companion/"
            echo ""
            echo "The generated deployment URL printed by Wrangler is authoritative. A branch alias may take time to resolve."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR preview link
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER='<!-- minecraft-companion-pr-preview -->'
          URL="https://pr-${PR_NUMBER}.vibecoding-card-translator-preview.pages.dev/apps/minecraft-companion/"
          BODY="${MARKER}
          ### Minecraft Companion preview

          Validation passed and Cloudflare Pages deployment completed.

          **[Open Minecraft Companion preview](${URL})**"
          COMMENT_ID=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n1 || true)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" >/dev/null
          else
            gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY" >/dev/null
          fi

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete this PR branch deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BRANCH="pr-${PR_NUMBER}"
          PROJECT=vibecoding-card-translator-preview
          deployments=$(npx --yes wrangler@4 pages deployment list --project-name "$PROJECT" --json)
          mapfile -t ids < <(printf '%s' "$deployments" | jq -r --arg branch "$BRANCH" '.[] | select(.deployment_trigger.metadata.branch == $branch) | .id')
          for id in "${ids[@]}"; do
            npx --yes wrangler@4 pages deployment delete "$id" --project-name "$PROJECT" --force
          done
