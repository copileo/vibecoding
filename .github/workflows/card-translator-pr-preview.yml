name: Card Translator PR Preview

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'apps/tradutor-cartas/**'
      - '.github/workflows/card-translator-pr-preview.yml'

concurrency:
  group: card-translator-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  validate:
    name: Validate static app
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        run: |
          node --check apps/tradutor-cartas/app.js
          node --check apps/tradutor-cartas/copileo-ai.js
          node --check apps/tradutor-cartas/sw.js

      - name: Validate local asset references
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('apps/tradutor-cartas')
          html = (root / 'index.html').read_text(encoding='utf-8')

          class AssetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'script' and attrs.get('src'):
                      self.refs.append(attrs['src'])
                  if tag == 'link' and attrs.get('href'):
                      self.refs.append(attrs['href'])
                  if tag == 'img' and attrs.get('src'):
                      self.refs.append(attrs['src'])

          parser = AssetParser()
          parser.feed(html)
          missing = []
          for ref in parser.refs:
              parts = urlsplit(ref)
              if parts.scheme or parts.netloc or ref.startswith(('#', 'data:')):
                  continue
              path = parts.path
              if not path or path in ('.', './'):
                  continue
              candidate = root / path.lstrip('./')
              if not candidate.exists():
                  missing.append(ref)

          if missing:
              raise SystemExit('Missing local assets referenced by index.html: ' + ', '.join(missing))
          print(f'Validated {len(parser.refs)} asset references.')
          PY

      - name: Smoke-test static serving
        run: |
          python3 -m http.server 4173 --directory apps/tradutor-cartas >/tmp/card-translator-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/app.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/copileo-ai.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/sw.js >/dev/null

  preview:
    name: Deploy PR preview
    needs: validate
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: card-translator-pr-${{ github.event.pull_request.number }}
      url: https://pr-${{ github.event.pull_request.number }}.vibecoding-card-translator-preview.pages.dev
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6

      - name: Ensure Cloudflare Pages preview project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PROJECT='vibecoding-card-translator-preview'
          if ! npx --yes wrangler@4 pages project list --json | jq -e --arg name "$PROJECT" '.[] | select(.name == $name)' >/dev/null; then
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy apps/tradutor-cartas
            --project-name=vibecoding-card-translator-preview
            --branch=pr-${{ github.event.pull_request.number }}
            --commit-hash=${{ github.event.pull_request.head.sha }}

      - name: Add preview link to job summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          STABLE_URL="https://pr-${PR_NUMBER}.vibecoding-card-translator-preview.pages.dev"
          {
            echo '## Card Translator PR Preview'
            echo
            echo "**Stable preview:** ${ALIAS_URL:-$STABLE_URL}"
            if [ -n "${DEPLOYMENT_URL:-}" ]; then
              echo
              echo "**This deployment:** ${DEPLOYMENT_URL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR preview comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          set -euo pipefail
          MARKER='<!-- card-translator-pr-preview -->'
          STABLE_URL="https://pr-${PR_NUMBER}.vibecoding-card-translator-preview.pages.dev"
          PREVIEW_URL="${ALIAS_URL:-$STABLE_URL}"
          BODY=$(cat <<EOF
          ${MARKER}
          ### Card Translator preview

          ✅ Validation passed and the PR preview is available:

          **${PREVIEW_URL}**

          This stable URL is updated whenever new commits are pushed to this PR and is removed when the PR is closed or merged.
          EOF
          )

          COMMENT_ID=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n1 || true)

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" >/dev/null
          else
            gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY" >/dev/null
          fi

  cleanup:
    name: Remove PR preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete Cloudflare Pages deployments for this PR
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PROJECT='vibecoding-card-translator-preview'
          BRANCH="pr-${PR_NUMBER}"

          deployments=$(npx --yes wrangler@4 pages deployment list \
            --project-name "$PROJECT" \
            --json)

          mapfile -t ids < <(printf '%s' "$deployments" | jq -r --arg branch "$BRANCH" \
            '.[] | select(.deployment_trigger.metadata.branch == $branch) | .id')

          if [ "${#ids[@]}" -eq 0 ]; then
            echo "No Cloudflare Pages deployments found for ${BRANCH}."
            exit 0
          fi

          for id in "${ids[@]}"; do
            echo "Deleting deployment ${id} for ${BRANCH}"
            npx --yes wrangler@4 pages deployment delete "$id" \
              --project-name "$PROJECT" \
              --force
          done

      - name: Update PR preview comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER='<!-- card-translator-pr-preview -->'
          BODY=$(cat <<EOF
          ${MARKER}
          ### Card Translator preview

          🧹 This PR is closed. Its Cloudflare Pages preview has been removed.
          EOF
          )

          COMMENT_ID=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n1 || true)

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" >/dev/null
          else
            gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY" >/dev/null
          fi
