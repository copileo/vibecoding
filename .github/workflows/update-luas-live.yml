name: Update Luas Live snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: luas-live-snapshots
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all Luas stop forecasts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/luas-live/data
          stops='tpt sdk msq gdk con bus abb jer fou smi mus heu jam fat ria sui gol dri bla blu kyl red kin bel coo hos tal fet che cit for sag bro cab phi gra brd dom par ocu ocg mar wes tri daw sti har cha ran bee cow mil win dun bal kil sti2 san cen gln gal leo bal2 car lau che2 bri'
          for stop in $stops; do
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 \
              "https://luasforecasts.rpa.ie/xml/get.ashx?action=forecast&stop=${stop}&encrypt=false" \
              --output "apps/luas-live/data/${stop}.xml"
          done

      - name: Commit refreshed snapshots
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/luas-live/data
          if git diff --cached --quiet; then
            echo 'No forecast changes to commit.'
          else
            git commit -m 'Update Luas live snapshots'
            git push
          fi