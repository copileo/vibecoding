name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - manifest.webmanifest
      - icon.svg
      - sw.js
      - apps/**
      - .github/workflows/refresh-luas-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          for file in manifest.webmanifest icon.svg sw.js; do
            [[ -f "$file" ]] && cp "$file" _site/
          done
          cp -R apps _site/apps
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
