name: Refresh Luas data and Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-luas-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          for file in manifest.webmanifest icon.svg sw.js; do
            [[ -f "$file" ]] && cp "$file" _site/
          done
          cp -R apps _site/apps
          touch _site/.nojekyll
      - env:
          LUAS_OUTPUT_DIR: _site/luas-data
        run: node scripts/update-luas-data.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4