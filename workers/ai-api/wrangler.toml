name = "vibecode-ai-api"
main = "src/entry.js"
compatibility_date = "2026-07-30"
workers_dev = true

[vars]
AI_API_VERSION = "1.0.0"
DEFAULT_MODEL = "gpt-5.4-nano"
SUPPORTED_MODELS = '[{"id":"gpt-5.4-nano","provider":"openai","capabilities":["chat","responses"]},{"id":"gpt-5","provider":"openai","capabilities":["chat","responses"]},{"id":"text-embedding-3-small","provider":"openai","capabilities":["embeddings"]}]'
CORS_ALLOWED_ORIGINS = "https://copileo.github.io"
MAX_REQUEST_BYTES = "65536"
PROVIDER_TIMEOUT_MS = "30000"
RATE_LIMIT_REQUESTS = "60"
RATE_LIMIT_WINDOW_SECONDS = "60"
CACHE_TTL_SECONDS = "3600"
